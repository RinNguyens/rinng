<html lang="en">
<head>

<title>rinng promo</title>
<style>
@font-face { font-family: "SG"; src: url("fonts/space-grotesk-latin-wght-normal.woff2") format("woff2"); font-weight: 300 700; }
@font-face { font-family: "GM"; src: url("fonts/geist-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
:root {
  --ink: #1c1917; --ink2: #292524; --line: rgba(255,255,255,.1);
  --paper: #f5f2ec; --amber: #fbbf24; --muted: #78716c; --soft: #a8a29e;
  --up: #2fb8a6; --down: #f0625a; --white: #fafaf9;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #0c0a09; height: 100%; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; transform-origin: 0 0; font-family: "SG", sans-serif; color: var(--ink); }
.scene { position: absolute; inset: 0; background: var(--paper); overflow: hidden; }
.scene.dark { background: var(--ink); color: var(--white); }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(28,25,23,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(28,25,23,.045) 1px, transparent 1px); background-size: 60px 60px; }
.dark .grid { background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); }
.mono { font-family: "GM", monospace; }

/* HUD */
.hud { position: absolute; left: 60px; right: 60px; top: 70px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 16px; font: 600 34px "GM", monospace; letter-spacing: -.5px; }
.brand svg { width: 56px; height: 56px; }
.segs { display: flex; gap: 8px; }
.seg { width: 56px; height: 6px; border-radius: 3px; background: rgba(28,25,23,.14); overflow: hidden; }
.seg i { display: block; width: 100%; height: 100%; background: var(--ink); transform-origin: 0 50%; }
.seg.done i { transform: none; }
.seg.todo i { transform: scaleX(0); }

.label { position: absolute; left: 60px; top: 226px; font: 500 28px "GM", monospace; letter-spacing: 3px; color: var(--muted); }
.head { position: absolute; left: 56px; top: 276px; font-weight: 700; font-size: 122px; line-height: .96; letter-spacing: -4.5px; text-transform: uppercase; }
.ln { display: block; overflow: hidden; padding-bottom: 6px; }
.ln > span { display: inline-block; }
.card { position: absolute; left: 60px; top: 580px; width: 960px; height: 800px; border-radius: 40px; background: var(--ink); color: var(--white); overflow: hidden; box-shadow: 0 40px 80px -30px rgba(28,25,23,.55); }
.card svg.full { position: absolute; left: 0; top: 0; width: 960px; height: 800px; }
.chips { position: absolute; left: 60px; top: 1418px; width: 960px; display: flex; gap: 10px; flex-wrap: wrap; }
/* */.chip { font: 500 22px "GM", monospace; letter-spacing: 1.5px; padding: 12px 14px; border-radius: 12px; background: rgba(28,25,23,.08); color: #57534e; }
.cap { position: absolute; left: 60px; top: 1512px; width: 940px; font-weight: 600; font-size: 46px; line-height: 1.28; letter-spacing: -1px; }
.cap mark { color: inherit; background: linear-gradient(var(--amber), var(--amber)) no-repeat 0 82%; background-size: 0% 46%; padding: 0 4px; margin: 0 -4px; }

/* in-card bits */
.tag { position: absolute; font: 600 21px "GM", monospace; letter-spacing: 1px; padding: 7px 12px; border-radius: 9px; white-space: nowrap; }
.tag.a { background: var(--amber); color: var(--ink); }
.tag.g { background: rgba(255,255,255,.1); color: var(--white); }
.tag.u { background: var(--up); color: #062b26; }
.tag.d { background: var(--down); color: #33090a; }
.node { position: absolute; display: flex; align-items: center; justify-content: center; gap: 12px; border: 1.5px solid rgba(255,255,255,.16); border-radius: 20px; background: var(--ink2); font: 600 30px "GM", monospace; letter-spacing: 1px; }
.node small { font: 500 20px "GM", monospace; color: var(--soft); letter-spacing: 1px; display: block; }
.dot { position: absolute; left: 0; top: 0; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: var(--amber); }
.tile { position: absolute; border-radius: 22px; background: var(--ink2); border: 1.5px solid var(--line); padding: 22px 24px; }
.tile b { display: block; font: 600 46px "GM", monospace; letter-spacing: -1.5px; color: var(--white); }
.tile span { font: 500 19px "GM", monospace; letter-spacing: 1.5px; color: var(--soft); }
.pane { position: absolute; border-radius: 18px; background: var(--ink2); border: 1.5px solid var(--line); overflow: hidden; }
.pane h6 { font: 500 19px "GM", monospace; letter-spacing: 1px; color: var(--soft); padding: 14px 16px 0; }
.pane svg { position: absolute; left: 0; top: 44px; width: 100%; height: calc(100% - 44px); }

/* keyframes */
@keyframes up { from { opacity: 0; transform: translateY(46px); } }
@keyframes down { from { opacity: 0; transform: translateY(-46px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.72); } }
@keyframes rise { from { transform: translateY(112%); } }
@keyframes slam { from { opacity: 0; transform: scale(1.5); filter: blur(14px); } }
@keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes wipeL { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0 0 0 0); } }

@keyframes growY { from { transform: scaleY(0); } }
@keyframes candle { from { opacity: 0; transform: scaleY(.15); } }
@keyframes mark { to { background-size: 100% 46%; } }
@keyframes chipOn { to { background: var(--amber); color: var(--ink); } }
@keyframes segOn { to { background: var(--amber); color: var(--ink); border-color: var(--amber); } }

@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(251,191,36,.7); } 100% { box-shadow: 0 0 0 26px rgba(251,191,36,0); } }
@keyframes sceneOut { to { transform: translateY(-100%); } }
@keyframes crown { 0% { opacity: 0; transform: translateY(-26px) rotate(-14deg); } 60% { opacity: 1; transform: translateY(3px) rotate(3deg); } 100% { opacity: 1; transform: none; } }
@keyframes type { from { width: 0; } }
@keyframes drift { to { transform: translateX(-240px); } }
@keyframes ring { from { opacity: 0; transform: scale(1.06); } }

<script>
const FPS = 30;

const T = [0, 3.7, 9.4, 15.9, 21.6, 27.2, 33.0, 38.0];

const counters = [];

function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function h(tag, cls, parent, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
function s(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

}
function box(el) { el.style.transformBox = 'fill-box'; return el; }
function pos(el, x, y, w, hh) { el.style.position = 'absolute'; el.style.left = x + 'px'; el.style.top = y + 'px'; if (w != null) el.style.width = w + 'px'; if (hh != null) el.style.height = hh + 'px'; return el; }

const LOGO = (crownId) => `<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1c1917"/><g ${crownId ? `id="${crownId}"` : ''} fill="#fbbf24" style="transform-box:fill-box;transform-origin:50% 100%"><path d="M18.5 21.5 16.5 11.5 24.6 16.2 32.25 8.5 39.9 16.2 48 11.5 46 21.5Z"/><circle cx="16.5" cy="11" r="1.9"/><circle cx="32.25" cy="8" r="1.9"/><circle cx="48" cy="11" r="1.9"/></g><path fill="#fafaf9" fill-rule="evenodd" d="M19 25H35A9 9 0 0 1 35 43H34.5L45.5 55H37.8L27.2 43H25.5V55H19ZM25.5 31H35A3 3 0 0 1 35 37H25.5Z"/></svg>`;

function scene(i, dark) {
  const el = h('div', 'scene' + (dark ? ' dark' : ''), stage);
  el.style.zIndex = 100 - i;
  h('div', 'grid', el);

function feature(i, label, lines, chips, caption) {

    if (k === i) A(bar, 'growX', t0, T[i + 1] - t0, 'linear');
  }

  const head = h('div', 'head', el);
  lines.forEach((ln, k) => A(h('span', '', h('span', 'ln', head), ln), 'rise', t0 + .18 + k * .12, .75));

}
function full(card) { return s('svg', { class: 'full', viewBox: '0 0 960 800' }, card); }
function tag(card, cls, text, x, y, t, anim = 'pop') { const e = pos(h('div', 'tag ' + cls, card, text), x, y); A(e, anim, t, .45, BACK); return e; }

function candles(svg, data, b, t0, stagger) {
  const lo = Math.min(...data.map(d => d.l)), hi = Math.max(...data.map(d => d.h));
  const Y = v => b.y + b.h - (v - lo) / (hi - lo) * b.h, step = b.w / data.length, X = i => b.x + step * (i + .5), bw = step * .6;
  data.forEach((d, i) => {
    const g = box(s('g', {}, svg)), col = d.c >= d.o ? 'var(--up)' : 'var(--down)';

    s('line', { x1: X(i), x2: X(i), y1: Y(d.h), y2: Y(d.l), stroke: col, 'stroke-width': Math.max(1.5, bw * .14) }, g);
    s('rect', { x: X(i) - bw / 2, y: Y(Math.max(d.o, d.c)), width: bw, height: Math.max(2, Math.abs(Y(d.o) - Y(d.c))), rx: 2, fill: col }, g);
    if (t0 != null) A(g, 'candle', t0 + i * stagger, .4, BACK);
  });
  return { X, Y, step };
}
function ohlc(closes, seed, wick = 1.5, start) {
  const r = rng(seed); let prev = start ?? closes[0] - 1.5;
  return closes.map(c => { const o = prev; prev = c; return { o, c, h: Math.max(o, c) + r() * wick + .2, l: Math.min(o, c) - r() * wick - .2 }; });
}
function walk(n, seed, drift, vol, start = 50) { const r = rng(seed); let v = start; const out = []; for (let i = 0; i < n; i++) { v += drift + (r() - .5) * vol; out.push(v); } return out; }

/* ───────── 0 · HOOK ───────── */

  [['Stop', .12], ['guessing', .42], ['the market.', .78]].forEach(([tx, t]) => { const d = h('div', '', w, tx); d.style.transformOrigin = '0 50%'; A(d, 'slam', t, .38, 'cubic-bezier(.2,.9,.2,1)'); });
  w.lastChild.style.fontSize = '138px'; w.lastChild.style.letterSpacing = '-5px';
  const m = h('div', '', el, '<span>Start measuring it.</span>'); m.style.cssText = 'position:absolute;left:60px;top:1100px;font-weight:700;font-size:92px;letter-spacing:-3px;color:#fbbf24;overflow:hidden;padding-bottom:10px';
  A(m.firstChild, 'rise', 1.75, .6); m.firstChild.style.display = 'inline-block';
  const b = h('div', '', el, LOGO('crown0') + '<div><div class="mono" style="font-size:84px;font-weight:600;letter-spacing:-3px;line-height:1">rinng</div><div class="mono" style="font-size:26px;letter-spacing:2px;color:#a8a29e;margin-top:10px">OPEN-SOURCE QUANT TOOLKIT</div></div>');

  tag(card, 'a', 'POC', 800, b.y + 11 * bh - 46, tt(5) + .5);

/* ───────── 3 · FORECAST ───────── */
(function () {
  const f = feature(3, 'FORECASTING', ['Odds,', 'not guesses.'], ['PROBABILITY CONE', 'LEVEL TOUCH', 'WALK-FORWARD'],

  const cone = s('svg', { class: 'full', viewBox: '0 0 960 800' }, card);
