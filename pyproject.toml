[project]
name = "rinng"
version = "0.1.0"
description = "Quant analysis for crypto: exchange data, indicators, SMC, volume profile, backtesting"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.12.0",
    "certifi>=2026.10.23",
    "duckdb>=2.0.0",
    "fastapi>=0.162.6",
    "httpx>=0.27",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "pydantic>=2.7",
    "pytz>=2026.6",
    "pyyaml>=6.0",
    "ta-lib>=0.8.3",
    "typer>=0.12",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.optional-dependencies]
# Legacy Streamlit dashboard (`rinng dashboard`) and the Plotly chart export (`rinng vpchart`).
dashboard = ["plotly>=7.1.0", "streamlit>=1.67.0"]

[project.scripts]
rinng = "rinng.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "rinng[dashboard]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rinng"]

[tool.hatch.build.targets.wheel.force-include]
# Default config shipped with the package, used when rinng runs outside the repo.
"configs/instruments.yaml" = "rinng/config/instruments.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: test needs network, skipped by default"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]
"src/rinng/cli.py" = ["B008"]  # typer.Option in default values is the standard usage
