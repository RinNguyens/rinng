[project]
name = "rinng"
version = "0.1.0"
description = "Phân tích quant cho crypto: dữ liệu sàn, indicator, SMC, volume profile, backtest"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
rinng = "rinng.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rinng"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test cần mạng, mặc định không chạy"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]
